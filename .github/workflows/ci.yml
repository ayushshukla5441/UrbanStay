name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci
      - name: Check backend syntax
        run: find Backend -path '*/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci
      - name: Lint frontend
        working-directory: Frontend
        run: npm run lint
      - name: Build frontend
        working-directory: Frontend
        run: npm run build
